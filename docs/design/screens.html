<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Open Pantry — preliminary screen designs</title>
    <style>
      :root {
        --bg: #f7f6f0;
        --paper: #fffefa;
        --ink: #223a2b;
        --muted: #667064;
        --line: #dedfd4;
        --green: #294f3b;
        --soft: #e9eee3;
        --amber: #865317;
        --warn: #fbf0d8;
        --red: #9c4036;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        font-size: 15px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button {
        min-height: 44px;
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--ink);
        border-radius: 10px;
        padding: 10px 15px;
      }
      button:hover {
        background: var(--soft);
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #b37b2c;
        outline-offset: 3px;
      }
      button.primary {
        background: var(--green);
        color: #fff;
        border-color: var(--green);
      }
      button.quiet {
        background: transparent;
        border-color: transparent;
      }
      input,
      select {
        width: 100%;
        min-height: 46px;
        background: var(--paper);
        border: 1px solid #adb5a7;
        border-radius: 9px;
        padding: 10px;
        color: var(--ink);
      }
      input[type="checkbox"] {
        width: 23px;
        min-height: 23px;
        accent-color: var(--green);
      }
      label {
        display: block;
        font-size: 14px;
      }
      label input,
      label select {
        margin-top: 7px;
      }
      a {
        color: var(--green);
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font-family: Georgia, serif;
        font-weight: 400;
        font-size: 44px;
        letter-spacing: -1.5px;
        line-height: 1.1;
        margin-bottom: 12px;
      }
      h2 {
        font:
          400 26px Georgia,
          serif;
        letter-spacing: -0.4px;
        margin-bottom: 8px;
      }
      h3 {
        font-size: 16px;
        margin-bottom: 7px;
      }
      p {
        line-height: 1.6;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 13px;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 11px;
        font-weight: 700;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .between {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .stack {
        display: grid;
        gap: 18px;
      }
      .hidden,
      [hidden] {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .rail {
        position: fixed;
        inset: 0 auto 0 0;
        width: 222px;
        padding: 36px 24px;
        background: #efefe6;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        z-index: 3;
      }
      .brand {
        font:
          25px Georgia,
          serif;
        line-height: 1.1;
        margin-bottom: 48px;
      }
      .brand span {
        display: block;
        margin-left: 35px;
      }
      .brand b {
        font-weight: 400;
        color: #63824d;
      }
      .rail nav {
        display: grid;
        gap: 9px;
      }
      .nav-btn {
        text-align: left;
        background: transparent;
        border-color: transparent;
        border-radius: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .nav-btn[aria-current="page"] {
        background: #dfe7d9;
        font-weight: 650;
      }
      .nav-index {
        font-size: 12px;
        color: var(--muted);
      }
      .rail-foot {
        margin-top: auto;
      }
      .rail-foot p {
        margin-bottom: 7px;
      }
      .design-label {
        padding: 9px 16px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        background: #ece9dd;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-left: 222px;
      }
      .design-label a {
        font-weight: 600;
      }
      .main {
        margin-left: 222px;
        padding: 42px 52px 135px;
        max-width: 1460px;
      }
      .top {
        margin-bottom: 32px;
      }
      .top .eyebrow {
        margin-bottom: 18px;
      }
      .subhead {
        margin: 0;
        color: var(--muted);
      }
      .sync {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 24px;
      }
      .dot {
        height: 7px;
        width: 7px;
        border-radius: 50%;
        background: #63824d;
      }
      .notice {
        padding: 13px 16px;
        border-radius: 10px;
        background: var(--warn);
        color: #704817;
        margin-bottom: 24px;
        font-size: 14px;
      }
      .columns {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 270px;
        gap: 30px;
        align-items: start;
      }
      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 17px;
        padding: 24px;
      }
      .stats-line {
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .section-head {
        margin: 30px 0 16px;
      }
      .section-head:first-child {
        margin-top: 0;
      }
      .pill {
        display: inline-block;
        font-size: 12px;
        border-radius: 6px;
        background: var(--soft);
        padding: 5px 9px;
        white-space: normal;
      }
      .pill.warn {
        background: var(--warn);
        color: var(--amber);
      }
      .pill.red {
        background: #f5e5df;
        color: var(--red);
      }
      .item {
        display: flex;
        gap: 15px;
        align-items: center;
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
      }
      .item:last-child {
        border-bottom: 0;
      }
      .food-icon {
        width: 47px;
        height: 51px;
        background: #eeeade;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 26px;
        flex-shrink: 0;
      }
      .item-text {
        flex: 1;
        min-width: 0;
      }
      .item-text strong {
        display: block;
        font-size: 15px;
        margin-bottom: 4px;
      }
      .item-text p {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }
      .item-end {
        text-align: right;
        display: grid;
        gap: 5px;
        justify-items: end;
      }
      .item-end button {
        min-height: 35px;
        padding: 5px 10px;
        font-size: 13px;
      }
      .toolbar {
        margin: 26px 0 10px;
        display: grid;
        grid-template-columns: 1fr 160px;
        gap: 10px;
      }
      .rule {
        padding: 24px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 14px;
        margin: 16px 0;
      }
      .rule p {
        margin: 9px 0 17px;
      }
      .rule .amount {
        font-size: 14px;
      }
      .line-progress {
        height: 5px;
        background: var(--soft);
        border-radius: 4px;
        margin: 17px 0;
      }
      .line-progress span {
        display: block;
        height: 100%;
        background: #7b9362;
        border-radius: 4px;
      }
      .rule-bottom {
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }
      .shopping-row {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 22px 0;
        border-bottom: 1px solid var(--line);
      }
      .shopping-row label {
        flex: 1;
        cursor: pointer;
      }
      .shopping-row strong {
        font-size: 16px;
      }
      .shopping-row p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .shopping-row.checked strong {
        text-decoration: line-through;
        color: var(--muted);
      }
      .buy-amount {
        font-weight: 650;
        white-space: nowrap;
      }
      .fab {
        position: fixed;
        bottom: 28px;
        right: 36px;
        z-index: 4;
        box-shadow: 0 5px 22px #294f3b25;
        border-radius: 30px;
        padding: 15px 24px;
        font-weight: 650;
      }
      .bottom-nav {
        display: none;
      }
      .empty {
        padding: 35px 10px;
        text-align: center;
        color: var(--muted);
      }
      .settings-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .settings-grid .wide {
        grid-column: 1/-1;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .check-label {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .check-label input {
        margin: 0;
      }
      .settings-actions {
        margin-top: 22px;
      }
      .toast {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        padding: 14px 20px;
        background: var(--ink);
        color: #fff;
        border-radius: 12px;
        z-index: 9;
        max-width: calc(100% - 32px);
        font-size: 14px;
        box-shadow: 0 6px 30px #0002;
      }
      .toast button {
        color: #fff;
        background: transparent;
        border: 0;
        min-height: 30px;
        padding: 3px 10px;
        text-decoration: underline;
      }
      dialog {
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 28px;
        width: min(510px, calc(100% - 24px));
        max-height: 90dvh;
        overflow: auto;
      }
      dialog::backdrop {
        background: #16251b88;
      }
      dialog h2 {
        font-size: 30px;
      }
      .dialog-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .dialog-head button {
        padding: 4px 12px;
      }
      .choices {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin: 10px 0 20px;
      }
      .choices button {
        flex: 1;
        min-width: 50px;
        padding: 10px 7px;
      }
      .choices button[aria-pressed="true"] {
        background: var(--green);
        color: #fff;
        border-color: var(--green);
      }
      .dialog-actions {
        display: flex;
        gap: 10px;
        margin-top: 24px;
        flex-wrap: wrap;
      }
      .dialog-actions button {
        flex: 1;
      }
      .camera {
        height: 220px;
        background: #23352b;
        border-radius: 14px;
        display: grid;
        place-items: center;
        color: #fff;
        text-align: center;
        margin: 16px 0;
      }
      .scan-frame {
        padding: 30px;
        border: 2px dashed #d2d9c9;
        border-radius: 8px;
      }
      .barcode {
        height: 42px;
        width: 135px;
        background: repeating-linear-gradient(
          90deg,
          #fff 0px,
          #fff 2px,
          transparent 2px,
          transparent 5px,
          #fff 5px,
          #fff 6px,
          transparent 6px,
          transparent 10px
        );
        margin: auto auto 14px;
      }
      .space {
        margin-top: 20px;
      }
      .summary-number {
        font:
          40px Georgia,
          serif;
      }
      @media (min-width: 1400px) {
        .main {
          padding-left: 75px;
          padding-right: 75px;
        }
        .columns {
          grid-template-columns: minmax(0, 1fr) 300px;
        }
      }
      @media (max-width: 1050px) {
        .rail {
          width: 185px;
          padding: 28px 18px;
        }
        .main {
          margin-left: 185px;
          padding: 32px 28px 130px;
        }
        .design-label {
          margin-left: 185px;
        }
        .columns {
          grid-template-columns: 1fr;
        }
        .aside {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 16px;
          order: -1;
        }
        .aside .panel {
          margin: 0 !important;
        }
        .settings-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 700px) {
        .rail {
          display: none;
        }
        .design-label {
          margin-left: 0;
          padding: 9px 18px;
          font-size: 11px;
        }
        .main {
          margin: 0;
          padding: 25px 19px 190px;
        }
        .top {
          margin-bottom: 23px;
        }
        h1 {
          font-size: 37px;
        }
        .columns {
          gap: 24px;
        }
        .aside {
          grid-template-columns: 1fr;
        }
        .aside .tip {
          display: none;
        }
        .bottom-nav {
          display: flex;
          position: fixed;
          inset: auto 0 0;
          background: var(--paper);
          border-top: 1px solid var(--line);
          z-index: 5;
          padding: 7px 7px calc(7px + env(safe-area-inset-bottom));
          justify-content: space-around;
        }
        .bottom-nav button {
          display: grid;
          text-align: center;
          gap: 3px;
          font-size: 12px;
          min-width: 73px;
          padding: 8px 7px;
        }
        .bottom-nav .nav-index {
          font-size: 14px;
        }
        .fab {
          bottom: calc(88px + env(safe-area-inset-bottom));
          right: 18px;
          padding: 13px 20px;
        }
        .panel {
          padding: 20px;
        }
        .toolbar {
          grid-template-columns: minmax(0, 1fr) 125px;
        }
        .item {
          gap: 10px;
        }
        .food-icon {
          width: 37px;
          height: 43px;
          font-size: 23px;
        }
        .item-end {
          max-width: 125px;
        }
        .item-end .pill {
          font-size: 11px;
        }
        .settings-grid,
        .form-grid {
          grid-template-columns: 1fr;
        }
        .rule {
          padding: 19px;
        }
        .rule-bottom {
          align-items: start;
        }
        .top-actions {
          align-items: start;
        }
        .top-actions button {
          padding: 8px 11px;
        }
        dialog {
          padding: 22px;
        }
        .toast {
          bottom: 160px;
          width: max-content;
        }
        .subhead {
          font-size: 14px;
        }
      }
      @media (max-width: 380px) {
        .panel > .row.between {
          flex-wrap: wrap;
        }
        .rule .food-icon {
          display: none;
        }
        .rule > .row > .row {
          min-width: 0;
          flex: 1;
        }
        .rule h3 {
          overflow-wrap: anywhere;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        button {
          transition: background 0.15s;
        }
      }

      /* Spacious date cards keep product details separate from the action. */
      .main {
        max-width: 1260px;
      }
      .columns {
        grid-template-columns: minmax(0, 1fr);
      }
      .top {
        margin-bottom: 28px;
      }
      h1 {
        font:
          500 30px ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: -0.8px;
        margin: 0;
      }
      h2 {
        font:
          600 20px ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: -0.3px;
        margin: 0;
      }
      .section-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .soon-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }
      .soon-card {
        background: var(--paper);
        border: 1px solid #ddd8c8;
        border-radius: 16px;
        padding: 24px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .soon-date {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
        color: var(--amber);
        font-size: 13px;
      }
      .soon-date strong {
        font-size: 18px;
        font-weight: 600;
        text-transform: capitalize;
      }
      .soon-date time {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
      }
      .soon-product {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .soon-product h3 {
        font-size: 19px;
        font-weight: 600;
        margin: 0 0 6px;
        overflow-wrap: anywhere;
      }
      .soon-product p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      .soon-product .food-icon {
        width: 50px;
        height: 54px;
        font-size: 28px;
      }
      .soon-footer {
        border-top: 1px solid var(--line);
        padding-top: 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 14px;
      }
      .soon-footer button {
        font-size: 13px;
        min-height: 44px;
      }
      .inventory-heading {
        margin-top: 36px;
      }
      .toolbar {
        margin-top: 0;
      }
      .rail-foot {
        padding-top: 24px;
      }
      .settings-grid {
        align-items: start;
      }
      @media (min-width: 1400px) {
        .columns {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      @media (max-width: 900px) {
        .soon-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 700px) {
        .main {
          padding-top: 24px;
        }
        .top {
          margin-bottom: 28px;
        }
        h1 {
          font-size: 28px;
        }
        .soon-card {
          padding: 22px;
          gap: 22px;
        }
        .soon-footer {
          padding-top: 16px;
        }
        .soon-grid {
          gap: 14px;
        }
        .inventory-heading {
          margin-top: 32px;
        }
      }

      .product-link {
        background: transparent;
        border: 0;
        border-radius: 4px;
        min-height: 44px;
        padding: 0;
        text-align: left;
        font-weight: 600;
        line-height: 1.3;
        max-width: 100%;
        overflow-wrap: anywhere;
      }
      .product-link:hover {
        background: transparent;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .item-text > .product-link {
        display: block;
        margin-bottom: 0;
        font-size: 15px;
      }
      .soon-product .product-link {
        font-size: 19px;
        min-height: 44px;
      }
      .soon-product h3 {
        margin-bottom: 7px;
      }
      .detail-section {
        padding: 22px 0;
        border-top: 1px solid var(--line);
      }
      .detail-section:last-child {
        padding-bottom: 0;
      }
      .detail-facts {
        margin: 18px 0;
      }
      .detail-facts > div {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr);
        gap: 14px;
        margin: 14px 0;
        font-size: 14px;
      }
      .detail-facts dt {
        color: var(--muted);
      }
      .detail-facts dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .detail-batch {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 15px 0;
        border-bottom: 1px solid var(--line);
      }
      .detail-batch p {
        margin: 6px 0 0;
      }
      .detail-batch:last-child {
        border: 0;
      }

      .inventory-layout-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 18px;
      }
      .inventory-layout-controls button {
        font-size: 13px;
        padding: 9px 13px;
        background: transparent;
      }
      .inventory-layout-controls button[aria-pressed="true"] {
        background: var(--green);
        color: #fff;
        border-color: var(--green);
      }
      .inventory-comparison {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
      }
      .component-option {
        min-width: 0;
      }
      .option-heading {
        border-top: 2px solid #b6c3ab;
        padding-top: 16px;
        margin-bottom: 20px;
      }
      .option-heading h3 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      .option-heading p {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
        line-height: 1.5;
        min-height: 60px;
      }
      .option-choose {
        margin-top: 20px;
        font-size: 13px;
        width: 100%;
      }
      .stock-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: start;
        gap: 14px;
        border-bottom: 1px solid var(--line);
        padding: 20px 0;
      }
      .stock-row .food-icon {
        margin-top: 7px;
        width: 40px;

    <div id="toast" class="toast" role="status" hidden></div>
    <script>
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      let inventoryLayout = "cards";
      let page = "pantry",
        offline = false,
        activeBatch = null,
        selectedFraction = 1,
        toastTimer;
      let batches = [
        {
          id: "bread",

          icon: "🍞",
          location: "Cupboard",
          unit: "slices",

        },
        {

        },
        {
          id: "milk-spare",
          name: "Whole milk",
          category: "Milk",
          icon: "🥛",
          location: "Fridge",
          packageUnit: "cartons",
          unit: "packs",
          initial: 1,
          remaining: 1,
          exact: false,
          opened: false,
          date: "2026-10-28",
          dateType: "MHD",
        },
        {
          id: "coffee",
          name: "Ground coffee",
          category: "Coffee",
          icon: "☕",
          location: "Cupboard",
          unit: "packs",
          initial: 1,
          remaining: 0.5,
          exact: false,
          opened: true,
          date: "2027-02-10",
          dateType: "MHD",
        },
        {
          id: "coffee-spare",
          name: "Ground coffee",
          category: "Coffee",
          icon: "☕",
          location: "Cupboard",
          unit: "packs",
          initial: 1,
          remaining: 1,
          exact: false,
          opened: false,
          date: "2027-06-15",
          dateType: "MHD",
        },
        {
          id: "rice",
          name: "Basmati rice",
          category: "Rice",
          icon: "🍚",
          location: "Cupboard",
          unit: "packs",
          initial: 1,
          remaining: 0.75,
          exact: false,
          opened: true,
          date: "2027-06-01",
          dateType: "MHD",
        },
      ];
      let rules = [
        {
          id: "r1",
          name: "Bread for tomorrow",
          category: "Bread",
          target: 3,
          strict: true,
          unit: "slices",
          unopened: false,
          icon: "🍞",
        },
        {
          id: "r2",
          name: "Milk in the fridge",
          category: "Milk",
          target: 2,
          strict: false,
          unit: "packs",
          unopened: false,
          icon: "🥛",
        },
        {
          id: "r3",
          name: "A spare coffee",
          category: "Coffee",
          target: 1,
          strict: false,
          unit: "packs",
          unopened: true,
          icon: "☕",
        },
      ];
      const basket = new Set();
      const productUnitDefaults = new Map();
      const unitOptions = [
        ["packs", "Packs"],
        ["cartons", "Cartons"],
        ["bottles", "Bottles"],
        ["loaves", "Loaves"],
        ["slices", "Slices"],
        ["pieces", "Pieces"],
        ["g", "Grams"],
        ["ml", "Millilitres"],
      ];
      const packageUnits = ["packs", "cartons", "bottles", "loaves"];
      const canonicalUnit = (unit) => (packageUnits.includes(unit) ? "packs" : unit);
      const currentUnit = (b) => b.packageUnit || b.unit;
      const unitSelect = (id, value) =>
        `<label>Track amount in<select id="${id}">${unitOptions.map(([key, label]) => `<option value="${key}" ${key === value ? "selected" : ""}>${label}</option>`).join("")}</select></label>`;
      const sampleUnitSuggestions = {
        "Whole milk": { unit: "cartons", quantity: 1 },
        "Ground coffee": { unit: "packs", quantity: 1 },
        "Sourdough bread": { unit: "slices", quantity: 20 },
        "Basmati rice": { unit: "packs", quantity: 1 },
      };
      const shelfDefaults = new Map();
      const sampleToday = "2026-10-21";
      function estimateDate(days) {
        const date = new Date(sampleToday + "T12:00:00Z");
        date.setUTCDate(date.getUTCDate() + Number(days));
        return date.toISOString().slice(0, 10);
      }
      const quarter = (v) =>
        ({ 0: "Empty", 0.25: "¼", 0.5: "½", 0.75: "¾", 1: "Full" })[v] || String(v);
      const effective = (r) => r.target + (r.strict ? 1 : 0);
      const available = (r) =>
        batches
          .filter(
            (b) =>
              b.category === r.category &&
              b.unit === r.unit &&
              (!r.unopened || !b.opened) &&
              b.remaining > 0 &&
              (!b.date || b.dateType === "Estimated reminder" || b.date >= "2026-10-21"),
          )
          .reduce((sum, b) => sum + b.remaining, 0);
      const missing = (r) => Math.max(0, effective(r) - available(r));
      const shortageRules = () => rules.filter((r) => missing(r) > 0);
      const unitLabel = (r, n) => (n === 1 ? r.unit.replace(/s$/, "") : r.unit);
      const sentence = (r) =>
        `Keep ${r.strict ? "more than" : "at least"} ${r.target} ${r.unopened ? "unopened " : ""}${unitLabel(r, r.target)} of ${r.category.toLowerCase()}`;
      const amount = (b) =>
        b.exact
          ? `${b.remaining} ${b.unit}`
          : `${quarter(b.remaining / b.initial)} ${b.opened ? "· opened" : "· unopened"}`;
      function dateLabel(b) {
        if (!b.date)
          return b.dateType === "No printed date" ? "No printed date" : "Date not entered";
        const d = Math.round((Date.parse(b.date) - Date.parse("2026-10-21")) / 86400000);
        return `${b.dateType} ${d === 0 ? "today" : d === 1 ? "tomorrow" : d < 0 ? (b.dateType === "Verbrauchsdatum" ? "passed · do not use" : b.dateType === "Estimated reminder" ? "passed · review estimate" : "passed · review") : new Date(b.date + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" })}`;
      }
      function toast(message, undo) {
        clearTimeout(toastTimer);
        $("#toast").replaceChildren(document.createTextNode(message));
        if (undo) {
          const button = document.createElement("button");
          button.textContent = "Undo";
          button.onclick = () => {
            undo();
            render();
            $("#toast").hidden = true;
          };
          $("#toast").append(button);
        }
        $("#toast").hidden = false;
        toastTimer = setTimeout(() => ($("#toast").hidden = true), 6500);
      }
      function header(title, action = "") {
        return `<header class="top"><div class="row between top-actions"><h1>${title}</h1>${action}</div></header>`;
      }
      function item(b, urgent = false) {
        return `<article class="item"><div class="food-icon" aria-hidden="true">${b.icon}</div><div class="item-text"><button class="product-link" data-detail="${b.id}">${esc(b.name)}</button><p>${esc(b.location)} · ${amount(b)}</p></div><div class="item-end"><span class="pill ${urgent ? "warn" : ""}">${dateLabel(b)}</span><button data-edit-batch="${b.id}" aria-label="Update ${esc(b.name)} ${b.opened ? "opened" : "unopened"} batch">Update</button></div></article>`;
      }
      function inventoryComponent(b, style) {
        const edit = `<button data-edit-batch="${b.id}" aria-label="Update ${esc(b.name)} ${b.opened ? "opened" : "unopened"} batch">Update</button>`,
          name = `<button class="product-link" data-detail="${b.id}">${esc(b.name)}</button>`,
          remaining = b.exact ? `${b.remaining} ${b.unit}` : quarter(b.remaining / b.initial),
          fraction = Math.max(0, Math.min(1, b.remaining / b.initial));
        if (style === "cards")
          return `<article class="stock-card"><div class="stock-card-title"><span class="food-icon" aria-hidden="true">${b.icon}</span><div>${name}<p>${esc(b.location)} · ${b.opened ? "Opened" : "Unopened"}</p></div></div><div class="stock-card-quantity"><strong>${remaining}</strong><span>remaining${b.exact ? "" : " · approximate"}</span></div>${b.exact ? "" : `<div class="stock-quarter-track" role="img" aria-label="${remaining} remaining">${[1, 2, 3, 4].map((n) => `<span class="${n <= fraction * 4 ? "filled" : ""}"></span>`).join("")}</div>`}<div class="stock-card-bottom"><span>${dateLabel(b)}</span>${edit}</div></article>`;
        if (style === "compact")
          return `<article class="stock-compact"><div class="stock-compact-main">${name}<span class="stock-inline-quantity">${remaining}</span></div><div class="stock-compact-sub"><span>${esc(b.location)} · ${b.opened ? "Opened" : "Unopened"}<br>${dateLabel(b)}</span>${edit}</div></article>`;
        return `<article class="stock-row"><span class="food-icon" aria-hidden="true">${b.icon}</span><div class="stock-row-body">${name}<p>${esc(b.location)} · ${b.opened ? "Opened" : "Unopened"}</p><span class="stock-date">${dateLabel(b)}</span></div><div class="stock-row-action"><strong>${remaining}</strong>${edit}</div></article>`;
      }
      function productGroups(rows) {
        const groups = new Map();
        for (const batch of rows) {
          const key = batch.name + "|" + batch.unit + "|" + (batch.packageUnit || "");
          const group = groups.get(key) || [];
          group.push(batch);
          groups.set(key, group);
        }
        return [...groups.values()];
      }
      function groupedCard(group) {
        if (group.length === 1) return inventoryComponent(group[0], "cards");
        const first = group[0],
          ordered = [...group].sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999")),
          total = group.reduce((n, b) => n + b.remaining, 0),
          count = group.reduce((n, b) => n + (b.exact ? 1 : b.initial), 0),
          opened = group.reduce((n, b) => n + (b.opened ? (b.exact ? 1 : b.initial) : 0), 0),
          unit = currentUnit(first),
          locations = [...new Set(group.map((b) => b.location))].join(", "),
          earliest = ordered.find((b) => b.date);
        return `<article class="stock-card stock-group"><div class="stock-card-title"><span class="food-icon" aria-hidden="true">${first.icon}</span><div><button class="product-link" data-detail="${first.id}">${esc(first.name)}</button><p>${esc(locations)} · ${group.length} batches</p></div></div><div class="stock-card-quantity"><strong>${total} ${unit}</strong><span>${group.some((b) => !b.exact) ? "approximately " : ""}remaining</span></div><p class="stock-group-summary">${count} ${first.exact ? "batches" : unit} · ${opened} opened · ${count - opened} unopened</p><div class="stock-group-date">${earliest ? "Earliest: " + dateLabel(earliest) : "No dates entered"}${group.some((b) => !b.date) ? '<br><span class="muted">Some dates are not entered</span>' : ""}</div><details class="stock-batches" open><summary>Individual ${first.exact ? "batches" : unit}</summary><div class="stock-batches-list">${ordered.map((b, index) => `<div class="stock-batch"><div class="stock-batch-heading"><strong>${{ cartons: "Carton", bottles: "Bottle", loaves: "Loaf", packs: "Pack" }[currentUnit(b)] || "Batch"} ${index + 1}</strong><span>${b.opened ? "Opened" : "Unopened"}</span></div><div class="stock-batch-amount"><span>${b.exact ? `${b.remaining} ${b.unit} left` : quarter(b.remaining / b.initial) + " left"}</span>${b.exact ? "" : `<div class="stock-quarter-track" role="img" aria-label="${quarter(b.remaining / b.initial)} remaining">${[1, 2, 3, 4].map((n) => `<span class="${n <= (b.remaining / b.initial) * 4 ? "filled" : ""}"></span>`).join("")}</div>`}</div><div class="stock-batch-bottom"><span>${esc(b.location)}<br>${dateLabel(b)}</span><button data-edit-batch="${b.id}" aria-label="Update ${esc(b.name)} ${b.opened ? "opened" : "unopened"} batch">Update</button></div></div>`).join("")}</div></details></article>`;
      }
      function inventoryCards(rows) {
        return productGroups(rows).map(groupedCard).join("");
      }
      const inventoryStyles = [
        [
          "rows",
          "Detailed rows",
          "Product, storage, and date stay together. Amount and action sit alongside.",
        ],
        [
          "cards",
          "Amount cards",
          "Remaining amounts are prominent, with quarter indicators for a quick visual check.",
        ],
        [
          "compact",
          "Compact list",
          "Less visual weight and no thumbnails; useful for a longer pantry list.",
        ],
      ];
      function inventoryMarkup(rows) {
        if (!rows.length)
          return '<p class="empty">No matching items. Try another search or scan an item.</p>';
        if (inventoryLayout === "compare")
          return `<div class="inventory-comparison">${inventoryStyles

              ([key, title, description]) =>
                `<section class="component-option" aria-label="${title}"><div class="option-heading"><h3>${title}</h3><p>${description}</p></div><div class="inventory-style-${key}">${
                  key === "cards"

                        .slice(0, 3)

              "",

        return `<div class="inventory-style-${inventoryLayout}">${inventoryLayout === "cards" ? inventoryCards(rows) : rows.map((b) => inventoryComponent(b, inventoryLayout)).join("")}</div>`;
      }
      function bindInventory() {
        bindDetails();
        document
          .querySelectorAll("[data-edit-batch]")

      function refreshInventory() {
        const rows = batches.filter(
          (b) =>

          bread = category === "Bread";
        showSheet(
          `<div class="dialog-head"><h2 id="sheet-title">${manual ? "Add a product" : "Add a purchase"}</h2>${closeButton}</div><form id="purchase-form" class="stack"><label>Product name<input id="purchase-name" value="${manual ? "" : category === "Bread" ? "Sourdough bread" : category === "Coffee" ? "Ground coffee" : "Whole milk"}" required></label><label>Category<select id="purchase-category">${["Bread", "Milk", "Coffee", "Rice"].map((v) => `<option ${v === category ? "selected" : ""}>${v}</option>`).join("")}</select></label>${unitSelect("purchase-unit-select", bread ? "slices" : "packs")}<p id="unit-source" class="small muted"></p><label>Amount in <span id="purchase-unit">${bread ? "slices" : "packs"}</span><input id="purchase-qty" type="number" min="1" step="1" value="${bread ? 20 : 1}" required></label>${dateFields("purchase")}<label>Location<select id="purchase-location"><option ${category === "Milk" ? "selected" : ""}>Fridge</option><option ${category !== "Milk" ? "selected" : ""}>Cupboard</option><option>Freezer</option></select></label><p id="date-default-note" class="small muted">Enter the printed MHD, or leave it unknown. A saved product default can suggest an estimated reminder.</p><button class="primary">Put in my pantry</button></form>`,
        );
        const refreshDate = bindDateFields("purchase");
        const suggestDate = () => {
          const days = shelfDefaults.get($("#purchase-name").value.trim());
          $("#purchase-type").value = days ? "Estimated reminder" : "MHD";
          $("#purchase-date").value = days ? estimateDate(days) : "";
          refreshDate();
          $("#date-default-note").textContent = days
            ? `Suggested from your saved default: ${days} days after adding. Choose MHD or Verbrauchsdatum to enter the printed date.`
            : "Dates are optional. Choose the label printed on this package, or record that no date is printed.";
        };
        const refreshUnit = () => {
          const unit = $("#purchase-unit-select").value;
          $("#purchase-unit").textContent = unit;
          $("#purchase-qty").step =
            packageUnits.includes(unit) || ["slices", "pieces"].includes(unit) ? "1" : "0.01";
        };
        const suggestUnit = () => {
          const name = $("#purchase-name").value.trim(),
            saved = productUnitDefaults.get(name),
            sample = sampleUnitSuggestions[name];
          $("#purchase-unit-select").value = saved || sample?.unit || "packs";
          $("#purchase-qty").value =
            sample && (!saved || saved === sample.unit) ? sample.quantity : 1;
          $("#unit-source").textContent = saved
            ? "Your saved unit for this product."
            : sample
              ? "Prefilled from sample product details. Real Open Food Facts suggestions will be confirmed here."
              : "No unit suggestion available. Choose how you want to track this product.";
          refreshUnit();
        };
        suggestDate();
        suggestUnit();
        $("#purchase-name").onchange = () => {
          suggestDate();
          suggestUnit();
        };
        $("#purchase-unit-select").onchange = () => {
          refreshUnit();
          $("#purchase-qty").value = "";
          $("#unit-source").textContent =
            "Your choice will be remembered for this product when saved.";
        };
        $("#purchase-form").onsubmit = (e) => {
          e.preventDefault();
          const cat = $("#purchase-category").value,
            qty = Number($("#purchase-qty").value);
          const b = {
            id: "purchase-" + Date.now(),
            name: $("#purchase-name").value,
            category: cat,
            icon: { Bread: "🍞", Milk: "🥛", Coffee: "☕", Rice: "🍚" }[cat],
            location: $("#purchase-location").value,
            unit: canonicalUnit($("#purchase-unit-select").value),
            packageUnit: packageUnits.includes($("#purchase-unit-select").value)
              ? $("#purchase-unit-select").value
              : undefined,
            initial: qty,
            remaining: qty,
            exact: !packageUnits.includes($("#purchase-unit-select").value),
            opened: false,
            date: $("#purchase-date").value,
            dateType: $("#purchase-type").value,
            dateSource:
              $("#purchase-type").value === "Estimated reminder" ? "personal-default" : "user",
          };
          productUnitDefaults.set(b.name, $("#purchase-unit-select").value);
          batches.push(b);
          if (r) basket.delete(r.id);
          $("#sheet").close();
          render();
          toast("Purchase added. Shopping list updated.", () => {
            batches = batches.filter((x) => x.id !== b.id);
          });
        };
      }
      $("#sheet").onclick = (e) => {
        if (e.target.closest("[data-close]")) $("#sheet").close();
      };
      $("#scan-open").onclick = scan;
      $("#offline-toggle").onclick = toggleOffline;
      render();
    </script>
  </body>
</html>
