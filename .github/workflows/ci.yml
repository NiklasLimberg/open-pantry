name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fresh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the migration checks compare with main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
        run: |
          psql -h localhost -U postgres -c 'create database test'
          pnpm db:migrate
          pnpm test
      - run: pnpm build

      # Merging must never leave the database behind the code. Pull requests run on top of
      # main, so two pull requests that each add a migration are caught by whichever merges second.
      - name: Migrations match schema.ts
        timeout-minutes: 5
        run: |
          pnpm exec drizzle-kit check
          pnpm db:generate
          git add --intent-to-add drizzle
          git diff --exit-code drizzle || { echo '::error::schema.ts changed without a committed migration; run pnpm db:generate and commit drizzle/'; exit 1; }
      - name: Migration history is consistent with main
        if: github.event_name == 'pull_request'
        run: node scripts/check-migrations.ts history
      - name: Migrations apply to an empty database
        run: |
          psql -h localhost -U postgres -c 'create database fresh'
          node .output/migrate/migrate.js
          node scripts/check-migrations.ts applied
      - name: Migrations apply on top of main's database
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/upgrade
        run: |
          psql -h localhost -U postgres -c 'create database upgrade'
          git archive origin/main drizzle | tar -x -C "$RUNNER_TEMP"
          MIGRATIONS_FOLDER="$RUNNER_TEMP/drizzle" node .output/migrate/migrate.js
          node .output/migrate/migrate.js
          node scripts/check-migrations.ts applied

  # A merge to main publishes the image; the server deploys it within five minutes.
  image:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/niklaslimberg/open-pantry:main
            ghcr.io/niklaslimberg/open-pantry:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
