name: open-pantry

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: journald
    options:
      tag: "open-pantry/{{.Name}}"

x-database-url: &database-url postgres://pantry:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/open_pantry

services:
  db:
    <<: *defaults
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: open_pantry
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, pantry, -d, open_pantry]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applies pending migrations, then exits. The app only starts after it succeeds.
  migrate:
    <<: *defaults
    image: ${OPEN_PANTRY_IMAGE:?Run deploy-open-pantry to select an image}
    restart: "no"
    command: [node, .output/migrate/migrate.js]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *defaults
    image: ${OPEN_PANTRY_IMAGE}
    environment:
      DATABASE_URL: *database-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    networks:
      default:
      # Shared with Caddy from home-infrastructure, which proxies to open-pantry:3000.
      home-apps:
        aliases: [open-pantry]

networks:
  home-apps:
    external: true

volumes:
  pgdata:
